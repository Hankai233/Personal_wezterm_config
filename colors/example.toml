# 自定义配色模板：复制本文件改名（文件名即方案名，不含 .toml），重启或重载即生效。
# 内置方案已有 1000+ 套，Ctrl+Shift+A 菜单里直接选；只有想覆盖/新增时才用本目录。
# 同名文件会覆盖内置同名方案。
# ANI 16 色顺序：black red green yellow blue magenta cyan white
# 也可参考 wezterm.color.load_base16_scheme / load_terminal_sexy_scheme 的格式，自行转换后填色。

[colors]
foreground = "#eeeeee"
background = "#111111"
cursor_bg = "#eeeeee"
cursor_border = "#eeeeee"
cursor_fg = "#111111"
selection_bg = "#44475a"
selection_fg = "#f8f8f2"

ansi = [
  "#111111", "#ff5555", "#50fa7b", "#f1fa8c",
  "#6272a4", "#ff79c6", "#8be9fd", "#bbbbbb",
]
brights = [
  "#44475a", "#ff5555", "#50fa7b", "#f1fa8c",
  "#6272a4", "#ff79c6", "#8be9fd", "#ffffff",
]
