# 自定义配色模板：复制本文件到 colors/，重载配置后出现在 Ctrl+Shift+A 列表，选中后生效。
# modules/colors.lua 会把 colors/ 注册进 config.color_scheme_dirs，因此即使通过
# --config-file 从默认配置目录之外启动，这里也会被 WezTerm 原生加载。
# 内置方案已有 1000+ 套，Ctrl+Shift+A 菜单里直接选；只有想覆盖/新增时才用本目录。
# 方案名优先取 [metadata] name，没有时才用文件名（不含 .toml）。
# 与内置方案同名时会覆盖内置方案（WezTerm 文档行为，未在命令行单独实测）。
# ANI 16 色顺序：black red green yellow blue magenta cyan white
# 也可参考 wezterm.color.load_base16_scheme / load_terminal_sexy_scheme 的格式，自行转换后填色。

[colors]
foreground = "#eeeeee"
background = "#111111"
cursor_bg = "#eeeeee"
cursor_border = "#eeeeee"
cursor_fg = "#111111"
selection_bg = "#44475a"
selection_fg = "#f8f8f2"

ansi = [
  "#111111", "#ff5555", "#50fa7b", "#f1fa8c",
  "#6272a4", "#ff79c6", "#8be9fd", "#bbbbbb",
]
brights = [
  "#44475a", "#ff5555", "#50fa7b", "#f1fa8c",
  "#6272a4", "#ff79c6", "#8be9fd", "#ffffff",
]
